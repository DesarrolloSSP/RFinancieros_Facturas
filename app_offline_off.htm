<!DOCTYPE html>
<html>
<head>
	<title>Página web en mantenimiento</title>
	<meta http-equiv="refresh" content="120;url=http://abastecimientos.sspver.gob.mx/" />
	<meta charset="utf-8"/>
	<meta name="description" content="Ejemplo práctico de aplicación del posicionamiento fijo"/>
	<meta name="author" content="francesc ricart"/>
	<style>
		/*TIPOGRAFÍAS*/
		@import url('https://fonts.googleapis.com/css?family=Noto+Sans');
		/*INICIALIZACIÓN DE ESTILOS*/
		*{
			margin:0;
			padding:0;
			box-sizing:border-box;
		}

		body{background-color: #f2eddd;  }

		/*PERSONALIZACIÓN DE P.MANTENIMIENTO*/
		.mantenimiento{
			width:700px;
			height:350px;
			padding:32px;
			border:2px solid #000;
			border-radius:10px;
			margin-top:-200px;
			margin-left:-350px;
			background-color: rgb(243, 241, 241); 		
			position:fixed;
			top:50%;
			left:50%;
		}
		.mantenimiento h1, .mantenimiento h2, .mantenimiento p{
			font-family:"noto sans", sans-serif;
		}

		.mantenimiento h1{
			font-size:2em;
			text-align:center;
			padding:16px;
			color: black;

		}
		.mantenimiento h2{
			font-size:1em;
			text-align:center;
			color: black;
		}
		.mantenimiento p{
			margin:16px 0;
			line-height:2em;
			color:blue;
			text-align: center;
			font-size:.9em;
		}
	</style>	
</head>
<body>
	<div class="mantenimiento">
		<h1>El sistema se reestablecer&aacute; en breve!!! ...</h1>
		<br>
		<br>
		<center><h2>Disculpe las molestias, estamos realizando una actualizaci&oacute;n este momento. </h2></center>
		<br>
		<br>
		<p><b>&mdash; Departamento de Tecnologias de la Informaci&oacute;n &mdash;</b> </p>
		<center><a href="https://www.gifsanimados.org/cat-relojes-137.htm"><img src="https://www.gifsanimados.org/data/media/137/reloj-imagen-animada-0139.gif" border="0" alt="reloj-imagen-animada-0139" /></a></center>
	</div>
</body>
</html>
